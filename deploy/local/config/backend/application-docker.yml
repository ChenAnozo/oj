spring:
  datasource:
    url: jdbc:mysql://mysql:3306/yuoj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: yuoj
    password: ${MYSQL_PASSWORD}
  redis:
    host: redis
    port: 6379
    database: 1
    password: ${REDIS_PASSWORD}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: yuoj
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
  session:
    redis:
      namespace: yuoj:docker:session
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        username: nacos
        password: ${NACOS_ADMIN_PASSWORD}
    gateway:
      routes:
        - id: judge-websocket
          uri: lb:ws://yuoj-backend-question-service
          predicates:
            - Path=/api/question/ws/**
        - id: user
          uri: lb://yuoj-backend-user-service
          predicates:
            - Path=/api/user/**
        - id: question
          uri: lb://yuoj-backend-question-service
          predicates:
            - Path=/api/question/**
        - id: judge
          uri: lb://yuoj-backend-judge-service
          predicates:
            - Path=/api/judge/**
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
codesandbox:
  type: ${SANDBOX_CLIENT_TYPE:discovery}
  service-id: yuoj-code-sandbox
  connect-timeout-ms: 2000
  read-timeout-ms: 90000
  url: http://code-sandbox:8090/executeCode
  auth-secret: ${SANDBOX_AUTH_SECRET}
oj:
  judge:
    max-processing: 1

judge:
  diagnostics:
    enabled: ${JUDGE_DIAGNOSTICS_ENABLED:false}
  case-max-bytes: ${JUDGE_CASE_MAX_BYTES:1048576}
